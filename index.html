<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>MandiocaTrack - Gestão de Pesquisa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/src/index.css" />
  <style>
    :root {
      --green-dark: #064e3b;
      --green: #166534;
      --green-soft: #dcfce7;
      --gold: #fbbf24;
      --gold-soft: #fef3c7;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-600: #4b5563;
      --gray-800: #1f2933;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
      color: #111827;
      margin: 0;
    }
    #authScreen, #appScreen { display: none; }
    .btn-primary {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 99px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-secondary {
      background: #e5e7eb;
      color: #374151;
      border: 1px solid #d1d5db;
      padding: 8px 16px;
      border-radius: 99px;
      cursor: pointer;
    }
    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      padding: 8px 16px;
      border-radius: 99px;
      cursor: pointer;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
      border: 1px solid var(--gray-200);
    }
    .app-layout { display: flex; flex-direction: column; height: 100vh; }
    .header {
      background: var(--green-dark);
      color: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .main-container { flex: 1; display: flex; overflow: hidden; }
    .sidebar {
      width: 260px;
      background: #111827;
      color: white;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .sidebar-item {
      padding: 12px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.2s;
    }
    .sidebar-item:hover { background: #1f2937; }
    .sidebar-item.active { background: var(--green); }
    .sidebar-item.disabled { opacity: 0.5; cursor: not-allowed; }
    .content-area { flex: 1; padding: 20px; overflow-y: auto; }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e5e7eb; }
    th { background: #f9fafb; font-size: 12px; text-transform: uppercase; color: #6b7280; }
    
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    @media (max-width: 768px) {
      .main-container { flex-direction: column; }
      .sidebar { width: 100%; height: auto; flex-direction: row; overflow-x: auto; }
      .sidebar-item { padding: 10px; flex-shrink: 0; font-size: 13px; }
    }
  </style>
</head>
<body>
  <div id="appScreen" class="app-layout" style="display: flex;">
    <header class="header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <div style="width: 32px; height: 32px; background: var(--green); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold;">M</div>
        <h1 style="font-size: 1.2rem;">MandiocaTrack</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 15px;">
        <span id="userEmail" style="font-size: 0.9rem; opacity: 0.9;"></span>
        <button id="btnLogout" class="btn-secondary" style="padding: 5px 15px;">Sair</button>
      </div>
    </header>

    <div class="main-container">
      <aside class="sidebar">
        <div class="sidebar-item" data-page="experiments">🧪 Experimentos</div>
        <div class="sidebar-item" data-page="experiment">📋 Identificação</div>
        <div class="sidebar-item" data-page="dbc">💠 Mapa DBC</div>
        <div class="sidebar-item" data-page="monitoring">✏️ Monitoramento</div>
        <div class="sidebar-item" data-page="monitoring-drone">🛰️ Drone</div>
        <div class="sidebar-item" data-page="harvest">🌾 Colheita</div>
        <div class="sidebar-item" data-page="interventions">📋 Intervenções</div>
        <div class="sidebar-item" data-page="climate">🌦 Clima</div>
        <div class="sidebar-item" data-page="charts">📊 Gráficos</div>
        <div class="sidebar-item" data-page="reports">📄 Relatórios</div>
      </aside>

      <main class="content-area" id="contentArea">
        <!-- Renderizado via JS -->
      </main>
    </div>
  </div>

  <div id="modalRoot" class="modal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 id="modalTitle" style="color: var(--green-dark);"></h3>
        <button id="modalClose" style="background: none; border: none; font-size: 24px; cursor: pointer;">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/src/db-local.js"></script>
  <script src="/src/app.js"></script>
  <script src="/src/experiments.js"></script>
  <script src="/src/monitoring.js"></script>
  <script src="/src/monitoring_drone.js"></script>
  <script src="/src/harvest.js"></script>
  <script src="/src/interventions.js"></script>
  <script src="/src/climate.js"></script>
  <script src="/src/charts.js"></script>
  <script src="/src/reports.js"></script>
  <script src="/src/cronograma.js"></script>
  <script src="/src/mapadbc.js"></script>
  <script src="/src/dashboard.js"></script>

  <!-- Bibliotecas externas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
